<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2025년 추계 계모임 참석 현황</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg,#eef2ff,#e0e7ff); }
    .card { box-shadow: 0 10px 25px rgba(0,0,0,.06); }
    .badge { font-size:.8rem; padding:.2rem .5rem; border-radius:.5rem; }
    .pill { border-radius: 1rem; }
    .btn-green { background:#059669; color:white; }
    .btn-green:hover { background:#047857; }
    .btn-gray { background:#d1d5db; color:#4b5563; cursor:not-allowed; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
  <div class="max-w-5xl mx-auto">
    <!-- 헤더 -->
    <div class="bg-white card rounded-2xl p-5 flex items-start justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-indigo-600 text-2xl">📅</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800">2025년 추계 계모임</h1>
        </div>
        <p class="text-sm text-gray-500 mt-1">모임일시 : <b>2025. 11. 22(토) 12:00</b></p>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge bg-indigo-50 text-indigo-600 border border-indigo-200">실시간 저장</span>
      </div>
    </div>

    <!-- 통계 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4">
      <div class="bg-green-50 text-green-700 border border-green-200 pill p-3 text-center font-semibold">
        참석 <span id="attendCount">0</span>명 · 총 <span id="totalPeople">0</span>명
      </div>
      <div class="bg-rose-50 text-rose-700 border border-rose-200 pill p-3 text-center font-semibold">
        불참 <span id="absentCount">0</span>명
      </div>
      <div class="bg-gray-50 text-gray-700 border border-gray-200 pill p-3 text-center font-semibold">
        미응답 <span id="pendingCount">16</span>명
      </div>
    </div>

    <!-- 표 -->
    <div class="bg-white card rounded-2xl mt-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-indigo-600 text-white">
          <tr>
            <th class="px-4 py-3 text-left w-16">번호</th>
            <th class="px-4 py-3 text-left">이름</th>
            <th class="px-4 py-3 text-center w-40">참석</th>
            <th class="px-4 py-3 text-center w-28">인원</th>
            <th class="px-4 py-3 text-center w-28">확인</th>
          </tr>
        </thead>
        <tbody id="memberBody"></tbody>
      </table>
    </div>

    <div class="mt-4 bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-sm text-yellow-800">
      ✅ 규칙: <b>하루 1번만 제출 가능</b>, 다음 날부터 <b>마감일(2025-11-07)</b> 전까지는 수정 가능, <b>마감일 이후 수정/제출 불가</b>
    </div>
  </div>

  <!-- Firebase + 앱 로직 -->
  <script type="module">
    // ----------------------------
    // 0) 환경설정
    // ----------------------------
    const DEADLINE = '2025-11-07'; // YYYY-MM-DD (Asia/Seoul 기준)

    function getSeoulDate() {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return fmt.format(now); // "YYYY-MM-DD"
    }
    const today = getSeoulDate();
    const pastDeadline = today > DEADLINE;

    // ----------------------------
    // 1) Firebase 설정(고정)
    // ----------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDQhi3QSFY-vE2x75ehBntmjG1BrYIVIH0",
      authDomain: "meet2025-2f126.firebaseapp.com",
      projectId: "meet2025-2f126",
      storageBucket: "meet2025-2f126.firebasestorage.app",
      messagingSenderId: "908909912507",
      appId: "1:908909912507:web:de10a11c099c9754c6385e"
    };

    // ----------------------------
    // 2) 명단
    // ----------------------------
    const initialMembers = [
      { id: 1, name: '이경득' }, { id: 2, name: '이경률' }, { id: 3, name: '김주식' }, { id: 4, name: '이경석' },
      { id: 5, name: '반병주' }, { id: 6, name: '정성대' }, { id: 7, name: '이경호' }, { id: 8, name: '김금순' },
      { id: 9, name: '이재성' }, { id: 10, name: '이동관' }, { id: 11, name: '한석원' }, { id: 12, name: '강양수' },
      { id: 13, name: '황두호' }, { id: 14, name: '이성근' }, { id: 15, name: '이경수' }, { id: 16, name: '이경철' }
    ];

    const COL_NAME = 'meeting-data-2025';
    const memberBody = document.getElementById('memberBody');
    const attendCountEl = document.getElementById('attendCount');
    const absentCountEl = document.getElementById('absentCount');
    const pendingCountEl = document.getElementById('pendingCount');
    const totalPeopleEl = document.getElementById('totalPeople');

    // ----------------------------
    // 3) Firebase 초기화
    // ----------------------------
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js');
    const { getFirestore, doc, setDoc, onSnapshot, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ----------------------------
    // 4) 렌더링
    // ----------------------------
    const rows = {};
    function setBtnState(btn, enabled) {
      if (enabled) {
        btn.disabled = false;
        btn.classList.remove('btn-gray');
        btn.classList.add('btn-green');
      } else {
        btn.disabled = true;
        btn.classList.remove('btn-green');
        btn.classList.add('btn-gray');
      }
    }

    function renderRows(dataMap = {}) {
      memberBody.innerHTML = '';
      let attending = 0, absent = 0, pending = 0, totalPax = 0;

      initialMembers.forEach((m, idx) => {
        const d = dataMap[m.id] || {};
        const last = d.lastSubmitted || null;            // YYYY-MM-DD
        const submittedToday = last === today;
        const lockedToday = submittedToday || pastDeadline; // 오늘 이미 제출 or 마감 경과 → 잠금

        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-4 py-3">${idx+1}</td>
          <td class="px-4 py-3 font-medium">${m.name}</td>
          <td class="px-4 py-3 text-center">
            <select class="border rounded-lg px-2 py-1" ${lockedToday ? 'disabled' : ''}>
              <option value="">선택</option>
              <option value="참석" ${d.attendance==='참석'?'selected':''}>참석</option>
              <option value="불참" ${d.attendance==='불참'?'selected':''}>불참</option>
            </select>
          </td>
          <td class="px-4 py-3 text-center">
            <input type="number" min="1" class="w-20 border rounded-lg px-2 py-1 text-center"
              ${ (lockedToday || d.attendance!=='참석') ? 'disabled' : '' }
              value="${d.attendance==='참석' ? (d.count ?? '') : ''}" />
          </td>
          <td class="px-4 py-3 text-center">
            <button class="saveBtn px-3 py-1 rounded-lg ${lockedToday ? 'btn-gray' : 'btn-green'}"
              ${lockedToday ? 'disabled' : ''}>확인</button>
          </td>
        `;

        const sel = tr.querySelector('select');
        const input = tr.querySelector('input');
        const saveBtn = tr.querySelector('saveBtn');

        const saveButton = tr.querySelector('.saveBtn');

        // 참석 선택에 따른 인원 입력 가능 여부
        sel?.addEventListener('change', () => {
          if (sel.value === '참석' && !lockedToday) {
            input.disabled = false;
            if (!input.value) input.value = '';
          } else {
            input.value = '';
            input.disabled = true;
          }
        });

        rows[m.id] = { tr, sel, input, saveBtn: saveButton, meta: { last } };
        memberBody.appendChild(tr);

        // 집계
        if (!d.attendance) pending++;
        else if (d.attendance === '참석') { attending++; totalPax += Number(d.count || 0); }
        else if (d.attendance === '불참') { absent++; }
      });

      attendCountEl.textContent = attending;
      absentCountEl.textContent = absent;
      pendingCountEl.textContent = pending;
      totalPeopleEl.textContent = totalPax;
    }

    // ----------------------------
    // 5) 실시간 구독
    // ----------------------------
    const map = {};
    initialMembers.forEach(m => {
      const ref = doc(db, COL_NAME, String(m.id));
      onSnapshot(ref, (snap) => {
        map[m.id] = snap.exists() ? snap.data() : {};
        renderRows(map);
      });
    });

    // ----------------------------
    // 6) 제출(일 1회 제한 + 마감일 적용)
    // ----------------------------
    memberBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('.saveBtn');
      if (!btn) return;

      const tr = btn.closest('tr');
      const idx = [...memberBody.children].indexOf(tr);
      const member = initialMembers[idx];
      const { sel, input, saveBtn } = rows[member.id];

      // 마감일 이후 전면 금지
      if (pastDeadline) {
        alert('마감일(2025-11-07) 이후에는 수정/제출할 수 없습니다.');
        setBtnState(saveBtn, false);
        sel.disabled = true; input.disabled = true;
        return;
      }

      // 오늘 이미 제출했는지 서버 상태 확인
      const ref = doc(db, COL_NAME, String(member.id));
      const cur = await getDoc(ref);
      const last = cur.exists() ? (cur.data().lastSubmitted || null) : null;
      if (last === today) {
        alert('하루 1번만 제출할 수 있습니다. (오늘 이미 제출됨)');
        setBtnState(saveBtn, false);
        sel.disabled = true; input.disabled = true;
        return;
      }

      const attendance = sel.value;
      const count = attendance === '참석' ? Number(input.value || 0) : 0;
      if (!attendance) { alert('참석/불참을 선택해주세요.'); return; }
      if (attendance === '참석' && (!count || count < 1)) { alert('인원을 1 이상 입력해주세요.'); return; }

      // 저장(오늘 제출일로 기록)
      const payload = {
        name: member.name,
        attendance,
        count,
        lastSubmitted: today,   // ← 일 1회 제한 근거
        updatedAt: new Date().toISOString()
      };
      await setDoc(ref, payload, { merge: true });

      // 오늘은 즉시 잠금
      sel.disabled = true;
      input.disabled = true;
      setBtnState(saveBtn, false);
    });

    // 초기 렌더
    renderRows({});
  </script>
</body>
</html>
