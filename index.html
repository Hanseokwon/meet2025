<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>2026년 춘계 계모임 참석 인원 파악(긴급)</title>
  <meta property="og:title" content="2026년 춘계 계모임 참석 인원 파악(긴급)" />
  <meta property="og:description" content="격조 높은 모임을 위해 소중한 응답을 기다립니다." />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
    
    body { 
      font-family: 'Pretendard', sans-serif;
      background: #f1f5f9; 
    }
    .main-card { 
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
      background: white;
    }
    .header-gradient {
      background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 100%);
    }
    .stat-box {
      border-radius: 1.25rem;
      transition: all 0.2s ease;
    }
    .save-btn {
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    .save-btn:active { transform: scale(0.96); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-10">
  <div class="max-w-4xl mx-auto">
    <div class="main-card rounded-[2.5rem] overflow-hidden mb-8">
      <div class="header-gradient p-8 text-white text-center sm:text-left">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-6">
          <div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">2026 춘계 계모임</h1>
            <p class="text-blue-100 mt-3 flex items-center justify-center sm:justify-start gap-2 text-lg">
              📅 <b>2026. 05. 30(토) 12:00</b>
            </p>
          </div>
          <button id="resetAll" class="px-4 py-2 bg-white/10 border border-white/20 rounded-full text-xs hover:bg-white/20 transition-all">관리자 메뉴</button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4 p-8 bg-white border-b border-slate-100">
        <div class="stat-box bg-blue-50 p-5 text-center">
          <p class="text-[11px] font-bold text-blue-500 uppercase mb-2">참석 명수</p>
          <p class="text-2xl font-black text-blue-900"><span id="attendCount">0</span>명 <span class="text-slate-300 text-sm">/</span> <span id="totalPeople" class="text-slate-400 font-normal">0</span></p>
        </div>
        <div class="stat-box bg-rose-50 p-5 text-center">
          <p class="text-[11px] font-bold text-rose-500 uppercase mb-2">불참 인원</p>
          <p id="absentCount" class="text-2xl font-black text-rose-900">0</p>
        </div>
        <div class="stat-box bg-slate-50 p-5 text-center">
          <p class="text-[11px] font-bold text-slate-500 uppercase mb-2">미응답</p>
          <p id="pendingCount" class="text-2xl font-black text-slate-900">0</p>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full">
          <tbody id="memberBody" class="divide-y divide-slate-100">
            </tbody>
        </table>
      </div>
    </div>

    <div class="bg-slate-800 text-slate-300 p-8 rounded-[2rem] text-sm leading-relaxed shadow-xl">
      <p class="flex items-center gap-2 mb-2 text-white font-bold"><span class="text-yellow-400">●</span> 필독 안내사항</p>
      <p>• 원활한 예약을 위해 <b>5월 15일까지</b> 응답해 주시기 바랍니다.</p>
      <p>• 참석 시 동반 인원을 포함한 총 인원을 숫자로 입력해 주세요.</p>
      <p class="mt-4 text-xs text-slate-500">※ 본 시스템은 개인별 실시간 데이터베이스와 동기화됩니다.</p>
    </div>
  </div>

  <script type="module">
    const DEADLINE = '2026-05-15'; 
    const CHOSEN_LS = 'meet2026_premium_key'; 
    const COL = 'meeting-data-2026'; 

    const today = new Intl.DateTimeFormat('sv-SE', {
      timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
    }).format(new Date());

    const firebaseConfig = {
      apiKey: "AIzaSyDQhi3QSFY-vE2x75ehBntmjG1BrYIVIH0",
      authDomain: "meet2025-2f126.firebaseapp.com",
      projectId: "meet2025-2f126",
      storageBucket: "meet2025-2f126.firebasestorage.app",
      messagingSenderId: "908909912507",
      appId: "1:908909912507:web:de10a11c099c9754c6385e"
    };

    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js');
    const { getFirestore, doc, setDoc, onSnapshot, writeBatch } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const members = [
      { id: 1, name: '이경득' }, { id: 2, name: '이경률' }, { id: 3, name: '김주식' }, { id: 4, name: '이경석' },
      { id: 5, name: '반병주' }, { id: 6, name: '정성대' }, { id: 7, name: '이경호' }, { id: 8, name: '김금순' },
      { id: 9, name: '이재성' }, { id: 10, name: '이동관' }, { id: 11, name: '한석원' }, { id: 12, name: '강양수' },
      { id: 13, name: '황두호' }, { id: 14, name: '이성근' }, { id: 15, name: '이경수' }, { id: 16, name: '이경철' }
    ];

    const dbMap = {};
    const memberBody = document.getElementById('memberBody');

    function renderRows(){
      memberBody.innerHTML = '';
      const chosen = localStorage.getItem(CHOSEN_LS);

      members.forEach((m, idx)=>{
        const d = dbMap[m.id] || {};
        const isLocked = d.lastSubmitted || (chosen && Number(chosen) !== m.id) || (today > DEADLINE);

        const tr = document.createElement('tr');
        tr.className = `group ${isLocked ? 'bg-slate-50/50' : 'bg-white hover:bg-blue-50/30'}`;
        tr.innerHTML = `
          <td class="px-6 py-6 font-bold text-slate-800 text-lg">${m.name}</td>
          <td class="px-2 py-6">
            <select class="w-full border-slate-200 rounded-xl px-3 py-3 text-sm focus:ring-2 focus:ring-blue-500" ${isLocked ? 'disabled' : ''}>
              <option value="">참석 여부</option>
              <option value="참석" ${d.attendance==='참석'?'selected':''}>참석</option>
              <option value="불참" ${d.attendance==='불참'?'selected':''}>불참</option>
            </select>
          </td>
          <td class="px-2 py-6">
            <input type="number" min="1" value="${d.count || ''}" placeholder="명" 
                   class="w-full text-center border-slate-200 rounded-xl px-2 py-3 text-sm" ${isLocked ? 'disabled' : ''} />
          </td>
          <td class="px-6 py-6 text-right">
            <button class="save-btn px-6 py-3 rounded-xl font-bold text-sm shadow-lg
                          ${isLocked ? 'bg-slate-200 text-slate-400' : 'bg-blue-600 text-white shadow-blue-200'}">
              ${d.lastSubmitted ? '완료' : '확인'}
            </button>
          </td>
        `;

        const btn = tr.querySelector('button');
        if(!isLocked){
          btn.addEventListener('click', async ()=>{
            const sel = tr.querySelector('select').value;
            const cnt = tr.querySelector('input').value;
            if(!sel) return alert('여부를 선택해 주세요.');
            if(sel==='참석' && !cnt) return alert('인원을 적어주세요.');

            await setDoc(doc(db, COL, String(m.id)), {
              name: m.name, attendance: sel, count: sel==='참석' ? Number(cnt) : 0, lastSubmitted: today
            }, { merge: true });

            localStorage.setItem(CHOSEN_LS, m.id);
            alert('정상적으로 등록되었습니다.');
            location.reload();
          });
        }
        memberBody.appendChild(tr);
      });

      let a=0, b=0, p=0, total=0;
      members.forEach(m=>{
        const d = dbMap[m.id] || {};
        if(d.attendance==='참석') { a++; total += (d.count || 0); }
        else if(d.attendance==='불참') b++;
        else p++;
      });
      document.getElementById('attendCount').textContent = a;
      document.getElementById('totalPeople').textContent = total;
      document.getElementById('absentCount').textContent = b;
      document.getElementById('pendingCount').textContent = p;
    }

    members.forEach(m=>{
      onSnapshot(doc(db, COL, String(m.id)), snap=>{
        dbMap[m.id] = snap.exists() ? snap.data() : {};
        renderRows();
      });
    });

    document.getElementById('resetAll').addEventListener('click', async ()=>{
      if(prompt('비밀번호') !== '1122') return;
      const batch = writeBatch(db);
      members.forEach(m=> batch.set(doc(db, COL, String(m.id)), { attendance:null, count:null, lastSubmitted:null }, {merge:true}));
      await batch.commit();
      localStorage.removeItem(CHOSEN_LS);
      location.reload();
    });
  </script>
</body>
</html>
