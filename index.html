<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>2026년 춘계 계모임 참석 인원 파악(긴급)</title>
  <meta property="og:title" content="2026년 춘계 계모임 참석 인원 파악(긴급)" />
  <meta property="og:description" content="여기를 눌러 링크를 확인하고 참석 여부를 입력해 주세요." />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg,#eef2ff,#e0e7ff); }
    .card { box-shadow: 0 10px 25px rgba(0,0,0,.06); }
    .badge { font-size:.8rem; padding:.2rem .5rem; border-radius:.5rem; }
    .pill { border-radius: 1rem; }
    .btn-green { background:#059669; color:white; }
    .btn-green:hover { background:#047857; }
    .btn-gray { background:#d1d5db; color:#4b5563; cursor:not-allowed; }
    .btn-outline { border:1px solid #c7d2fe; color:#4f46e5; background:#eef2ff; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
  <div class="max-w-5xl mx-auto">
    <div class="bg-white card rounded-2xl p-5 flex items-start justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-indigo-600 text-2xl">📅</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800">2026년 춘계 계모임</h1>
        </div>
        <p class="text-sm text-gray-500 mt-1">모임일시 : <b>2026. 05. 30(토) 12:00</b></p>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge bg-indigo-50 text-indigo-600 border border-indigo-200">실시간 저장</span>
        <button id="resetAll" class="px-3 py-1 rounded-lg btn-outline">관리자 초기화</button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4">
      <div class="bg-green-50 text-green-700 border border-green-200 pill p-3 text-center font-semibold">
        참석 <span id="attendCount">0</span>명 · 총 <span id="totalPeople">0</span>명
      </div>
      <div class="bg-rose-50 text-rose-700 border border-rose-200 pill p-3 text-center font-semibold">
        불참 <span id="absentCount">0</span>명
      </div>
      <div class="bg-gray-50 text-gray-700 border border-gray-200 pill p-3 text-center font-semibold">
        미응답 <span id="pendingCount">0</span>명
      </div>
    </div>

    <div class="bg-white card rounded-2xl mt-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-indigo-600 text-white">
          <tr>
            <th class="px-4 py-3 w-16">번호</th>
            <th class="px-4 py-3">이름</th>
            <th class="px-4 py-3 text-center w-40">참석</th>
            <th class="px-4 py-3 text-center w-28">인원</th>
            <th class="px-4 py-3 text-center w-28">확인</th>
          </tr>
        </thead>
        <tbody id="memberBody"></tbody>
      </table>
    </div>

    <div class="mt-4 bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-sm text-yellow-800">
      ✅ <b>내가 처음 선택한 1명만</b> 활성화, 다른 사람 칸은 선택/입력 불가(회색)<br>
      ✅ 개인별 하루 1회, 기기/브라우저 당 하루 1명, <b>마감일(2026-05-15)</b> 이후 전면 불가<br>
      📊 통계는 실시간(DB 값 기준)으로 반영됩니다.
    </div>
  </div>

  <script type="module">
    /* ===== 설정값 (2026년 기준) ===== */
    const DEADLINE = '2026-05-15'; 
    const CHOSEN_LS = 'meet2026_chosen_member'; 
    const COL = 'meeting-data-2026'; 

    const today = new Intl.DateTimeFormat('sv-SE', {
      timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
    }).format(new Date());
    const pastDeadline = today > DEADLINE;

    function getChosenLocal(){
      try{
        const raw = localStorage.getItem(CHOSEN_LS);
        if(!raw) return null;
        const o = JSON.parse(raw);
        if(o && o.date === today) return o; 
      }catch(e){}
      return null;
    }
    function setChosenLocal(memberId){
      localStorage.setItem(CHOSEN_LS, JSON.stringify({date: today, memberId}));
    }
    function clearChosenLocal(){ localStorage.removeItem(CHOSEN_LS); }

    /* ===== Firebase (기존 설정 유지) ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyDQhi3QSFY-vE2x75ehBntmjG1BrYIVIH0",
      authDomain: "meet2025-2f126.firebaseapp.com",
      projectId: "meet2025-2f126",
      storageBucket: "meet2025-2f126.firebasestorage.app",
      messagingSenderId: "908909912507",
      appId: "1:908909912507:web:de10a11c099c9754c6385e"
    };
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js');
    const { getFirestore, doc, setDoc, onSnapshot, getDoc, writeBatch } =
      await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ===== 명단 ===== */
    const members = [
      { id: 1, name: '이경득' }, { id: 2, name: '이경률' }, { id: 3, name: '김주식' }, { id: 4, name: '이경석' },
      { id: 5, name: '반병주' }, { id: 6, name: '정성대' }, { id: 7, name: '이경호' }, { id: 8, name: '김금순' },
      { id: 9, name: '이재성' }, { id: 10, name: '이동관' }, { id: 11, name: '한석원' }, { id: 12, name: '강양수' },
      { id: 13, name: '황두호' }, { id: 14, name: '이성근' }, { id: 15, name: '이경수' }, { id: 16, name: '이경철' }
    ];

    const dbMap = {};     
    const uiOverride = {}; 
    const memberBody = document.getElementById('memberBody');

    function recomputeStats(){
      let a=0,b=0,p=0,t=0;
      members.forEach(m=>{
        const d = dbMap[m.id] || {};
        const att = d.attendance || '';
        if(!att) p++;
        else if(att==='참석'){ a++; t += Number(d.count||0); }
        else if(att==='불참'){ b++; }
      });
      document.getElementById('attendCount').textContent = a;
      document.getElementById('absentCount').textContent = b;
      document.getElementById('pendingCount').textContent = p;
      document.getElementById('totalPeople').textContent = t;
    }

    function renderRows(){
      memberBody.innerHTML = '';
      const chosen = getChosenLocal(); 

      members.forEach((m, idx)=>{
        const d = dbMap[m.id] || {};
        const submittedToday = (d.lastSubmitted === today);
        const rowLocked = submittedToday || pastDeadline || (chosen && chosen.memberId !== m.id);

        const temp = uiOverride[m.id] || {};
        const displayAttendance = rowLocked ? (d.attendance || '') : (temp.attendance ?? '');
        const displayCount = rowLocked
          ? (d.attendance === '참석' ? (d.count ?? '') : '')
          : ((temp.attendance ?? '') === '참석' ? (temp.count ?? '') : '');

        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-4 py-3">${idx+1}</td>
          <td class="px-4 py-3 font-medium">${m.name}</td>
          <td class="px-4 py-3 text-center">
            <select class="border rounded-lg px-2 py-1" ${rowLocked ? 'disabled' : ''}>
              <option value="" ${displayAttendance===''?'selected':''}>선택</option>
              <option value="참석" ${displayAttendance==='참석'?'selected':''}>참석</option>
              <option value="불참" ${displayAttendance==='불참'?'selected':''}>불참</option>
            </select>
          </td>
          <td class="px-4 py-3 text-center">
            <input type="number" min="1" class="w-20 border rounded-lg px-2 py-1 text-center"
                   value="${displayCount}" ${rowLocked ? 'disabled' : ''}/>
          </td>
          <td class="px-4 py-3 text-center">
            <button class="saveBtn px-3 py-1 rounded-lg ${rowLocked?'btn-gray':'btn-green'}"
                    ${rowLocked?'disabled':''}>확인</button>
          </td>
        `;

        const sel = tr.querySelector('select');
        const input = tr.querySelector('input');
        const saveBtn = tr.querySelector('.saveBtn');

        if(!chosen && !rowLocked){
          sel.addEventListener('change', ()=>{
            if(sel.value){
              setChosenLocal(m.id);
              uiOverride[m.id] = { attendance: sel.value, count: input.value || '' };
              renderRows(); 
            }
          });
        }

        if(!rowLocked){
          saveBtn.addEventListener('click', async ()=>{
            if(pastDeadline){ alert('마감일이 지났습니다.'); return; }
            const attendance = sel.value;
            const countVal = attendance === '참석' ? Number(input.value) : 0;

            if(!attendance){ alert('참석 여부를 선택해주세요.'); return; }
            if(attendance==='참석' && countVal < 1){ alert('인원을 입력해주세요.'); return; }

            await setDoc(doc(db, COL, String(m.id)), {
              name: m.name, attendance, count: countVal,
              lastSubmitted: today, updatedAt: new Date().toISOString()
            }, { merge: true });

            delete uiOverride[m.id];
            alert('입력이 완료되었습니다.');
          });
        }
        memberBody.appendChild(tr);
      });
      recomputeStats();
    }

    members.forEach(m=>{
      onSnapshot(doc(db, COL, String(m.id)), snap=>{
        dbMap[m.id] = snap.exists()? snap.data() : {};
        renderRows();
      });
    });

    document.getElementById('resetAll').addEventListener('click', async ()=>{
      if(prompt('비밀번호')!=='1122') return;
      const batch = writeBatch(db);
      members.forEach(m=> batch.set(doc(db, COL, String(m.id)), { attendance:null, count:null, lastSubmitted:null }, {merge:true}));
      await batch.commit();
      clearChosenLocal();
      location.reload();
    });
  </script>
</body>
</html>
